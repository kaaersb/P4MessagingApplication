<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface-2: #161616;
            --surface-3: #1c1c1c;
            --border: #222222;
            --accent: #e8ff47;
            --accent-dim: #b8cc30;
            --text: #f0f0f0;
            --muted: #666666;
            --online: #47ff8a;
            --error: #ff4757;
            --nav-h: 56px;
            --sidebar-w: 300px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAV ===== */
        nav {
            height: var(--nav-h);
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 200;
            flex-shrink: 0;
            position: relative;
        }

        .nav-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dot {
            width: 7px; height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.6); }
        }

        .nav-right { display: flex; align-items: center; gap: 12px; }

        .user-chip {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.75rem; color: var(--muted);
            padding: 5px 10px;
            border: 1px solid var(--border);
        }

        .online-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--online);
            box-shadow: 0 0 6px var(--online);
        }

        .notif-btn {
            position: relative;
            background: none; border: 1px solid var(--border);
            color: var(--muted); cursor: pointer;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            transition: border-color 0.2s, color 0.2s;
        }
        .notif-btn:hover { border-color: var(--accent); color: var(--accent); }

        .notif-badge {
            position: absolute; top: -6px; right: -6px;
            background: var(--error); color: white;
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.6rem; width: 18px; height: 18px;
            border-radius: 50%;
            align-items: center; justify-content: center;
            display: none;
        }

        .nav-btn {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.72rem; letter-spacing: 0.08em;
            text-transform: uppercase; padding: 7px 14px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); cursor: pointer;
            text-decoration: none; transition: all 0.2s;
        }
        .nav-btn:hover { border-color: var(--error); color: var(--error); }

        .notif-dropdown {
            position: absolute; top: calc(100% + 4px); right: 20px;
            width: 300px; background: var(--surface);
            border: 1px solid var(--border);
            z-index: 300; display: none;
        }
        .notif-dropdown.open { display: block; animation: fadeDown 0.2s ease both; }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notif-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase;
        }

        .notif-item {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }

        .notif-name { font-size: 0.82rem; }
        .notif-sub { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
        .notif-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .notif-accept {
            background: var(--accent); color: #0a0a0a;
            border: none; cursor: pointer; font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 0.65rem; padding: 5px 9px;
            text-transform: uppercase; transition: background 0.2s;
        }
        .notif-accept:hover { background: var(--accent-dim); }

        .notif-decline {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); cursor: pointer;
            font-family: 'Syne', sans-serif; font-size: 0.65rem;
            padding: 5px 9px; text-transform: uppercase; transition: all 0.2s;
        }
        .notif-decline:hover { border-color: var(--error); color: var(--error); }
        .notif-empty { padding: 20px 16px; font-size: 0.75rem; color: var(--muted); text-align: center; }

        /* ===== LAYOUT ===== */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--surface);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .add-friend-btn {
            background: var(--accent); color: #0a0a0a;
            border: none; cursor: pointer;
            width: 28px; height: 28px;
            font-size: 1.2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
            font-family: 'Syne', sans-serif; line-height: 1;
        }
        .add-friend-btn:hover { background: var(--accent-dim); }

        .friends-list { flex: 1; overflow-y: auto; }
        .friends-list::-webkit-scrollbar { width: 4px; }
        .friends-list::-webkit-scrollbar-thumb { background: var(--border); }

        .friend-card {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .friend-card:hover { background: var(--surface-2); }
        .friend-card.active { background: var(--surface-3); border-left: 2px solid var(--accent); padding-left: 14px; }

        .friend-avatar {
            width: 40px; height: 40px; flex-shrink: 0;
            background: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 1rem; color: var(--accent);
        }

        .friend-info { flex: 1; min-width: 0; }

        .friend-name {
            font-size: 0.85rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .friend-last-msg {
            font-size: 0.72rem; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-top: 3px;
        }

        .empty-friends {
            padding: 32px 16px; text-align: center;
            color: var(--muted); font-size: 0.78rem; line-height: 1.9;
        }

        /* ===== CHAT PANEL ===== */
        .chat-panel {
            flex: 1; display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .chat-empty {
            flex: 1; display: flex;
            flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--muted); text-align: center; padding: 40px;
        }

        .chat-empty .big-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }

        .chat-empty h3 {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 1.1rem; margin-bottom: 8px; color: var(--text);
        }

        .chat-empty p { font-size: 0.78rem; line-height: 1.7; }

        .chat-header {
            height: 56px; flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 20px; gap: 12px;
            background: var(--surface);
        }

        .chat-header-avatar {
            width: 32px; height: 32px; background: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.85rem; color: var(--accent);
        }

        .chat-header-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 0.9rem;
        }

        .messages-area {
            flex: 1; overflow-y: auto;
            padding: 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border); }

        .msg-row { display: flex; }
        .msg-row.sent { justify-content: flex-end; }
        .msg-row.received { justify-content: flex-start; }

        .msg-bubble {
            max-width: 65%;
            padding: 10px 14px;
            font-size: 0.85rem; line-height: 1.5;
            animation: msgIn 0.2s ease both;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.sent .msg-bubble { background: var(--accent); color: #0a0a0a; }
        .msg-row.received .msg-bubble { background: var(--surface-3); color: var(--text); border: 1px solid var(--border); }

        .msg-time {
            font-size: 0.62rem; color: var(--muted);
            margin-top: 4px; text-align: right;
        }
        .msg-row.received .msg-time { text-align: left; color: #444; }
        .msg-row.sent .msg-time { color: rgba(0,0,0,0.45); }

        .chat-input-bar {
            flex-shrink: 0; padding: 14px 16px;
            border-top: 1px solid var(--border);
            display: flex; gap: 10px;
            background: var(--surface);
        }

        .chat-input {
            flex: 1; background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Mono', monospace; font-size: 0.85rem;
            padding: 10px 14px; outline: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus { border-color: var(--accent); }
        .chat-input::placeholder { color: var(--muted); }

        .send-btn {
            background: var(--accent); color: #0a0a0a;
            border: none; cursor: pointer;
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.8rem; letter-spacing: 0.05em;
            padding: 10px 20px;
            transition: background 0.2s; white-space: nowrap;
        }
        .send-btn:hover { background: var(--accent-dim); }

        /* ===== HERO ===== */
        .hero {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-tag {
            font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 24px;
            border: 1px solid rgba(232,255,71,0.3); padding: 6px 14px;
        }

        .hero h1 {
            font-family: 'Syne', sans-serif; font-weight: 800;
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 1; letter-spacing: -0.03em; margin-bottom: 20px;
        }
        .hero h1 span { color: var(--accent); }
        .hero p { color: var(--muted); font-size: 0.85rem; max-width: 340px; line-height: 1.8; margin-bottom: 36px; }

        .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

        .btn-large {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase;
            padding: 13px 26px; text-decoration: none; transition: all 0.2s;
            cursor: pointer; border: none;
        }
        .btn-large.primary { background: var(--accent); color: #0a0a0a; }
        .btn-large.primary:hover { background: var(--accent-dim); }
        .btn-large.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-large.secondary:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            z-index: 500; display: none;
            align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface); border: 1px solid var(--border);
            width: 100%; max-width: 420px; padding: 28px;
            animation: fadeUp 0.25s ease both;
        }

        .modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }

        .modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; }

        .modal-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 20px; }

        .modal-close {
            background: none; border: none; color: var(--muted);
            cursor: pointer; font-size: 1.2rem; line-height: 1; transition: color 0.2s;
        }
        .modal-close:hover { color: var(--text); }

        .modal-input {
            width: 100%; background: var(--bg);
            border: 1px solid var(--border); color: var(--text);
            font-family: 'DM Mono', monospace; font-size: 0.9rem;
            padding: 12px 14px; outline: none; transition: border-color 0.2s;
            margin-bottom: 10px;
        }
        .modal-input:focus { border-color: var(--accent); }
        .modal-input::placeholder { color: var(--muted); }

        .search-result-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: var(--bg);
            border: 1px solid var(--border); margin-bottom: 6px;
        }

        .search-result-name { font-size: 0.85rem; }
        .search-result-id { font-size: 0.7rem; color: var(--muted); }

        .add-btn {
            background: var(--accent); color: #0a0a0a; border: none;
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 0.7rem; padding: 5px 10px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.05em; transition: background 0.2s;
        }
        .add-btn:hover { background: var(--accent-dim); }
        .add-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

        .modal-message {
            margin-top: 8px; font-size: 0.78rem; padding: 10px 12px;
            border-left: 3px solid transparent; display: none;
        }
        .modal-message.success { border-color: var(--accent); background: rgba(232,255,71,0.06); color: var(--accent); display: block; }
        .modal-message.error { border-color: var(--error); background: rgba(255,71,87,0.06); color: var(--error); display: block; }
    </style>
</head>
<body>

<!-- NAV -->
<nav>
    <div class="nav-logo"><div class="logo-dot"></div>Messenger</div>
    <div class="nav-right" id="nav-right"></div>

    <!-- Notification dropdown (inside nav for positioning) -->
    <div class="notif-dropdown" id="notif-dropdown">
        <div class="notif-header">Friend Requests</div>
        <div id="notif-list"><div class="notif-empty">No pending requests</div></div>
    </div>
</nav>

<!-- Add Friend Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="modal">
        <div class="modal-top">
            <div class="modal-title">Add Friend</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-sub">Search by username to send a friend request.</div>
        <input class="modal-input" id="search-input" placeholder="Enter username..." autocomplete="off" oninput="searchUsers()" />
        <div id="search-results"></div>
        <div class="modal-message" id="modal-message"></div>
    </div>
</div>

<!-- APP BODY -->
<div class="app-body" id="app-body"></div>

<script>
    const BASE = "http://127.0.0.1:8000";
    const userId = sessionStorage.getItem("user_id");
    const username = sessionStorage.getItem("username");
    const isLoggedIn = userId && username;

    let activeFriendId = null;
    let activeFriendName = null;
    let pollInterval = null;
    let notifOpen = false;

    // ===== NAV =====
    const navRight = document.getElementById("nav-right");
    if (isLoggedIn) {
        navRight.innerHTML = `
            <div class="user-chip"><div class="online-dot"></div>${username}</div>
            <button class="notif-btn" id="notif-btn" onclick="toggleNotif(event)">
                🔔
                <span class="notif-badge" id="notif-badge"></span>
            </button>
            <button class="nav-btn" onclick="logout()">Sign Out</button>
        `;
    } else {
        navRight.innerHTML = `
            <a href="/login.html" class="nav-btn" style="color:var(--text)">Sign In</a>
            <a href="/register.html" class="nav-btn" style="background:var(--accent);color:#0a0a0a;border-color:var(--accent)">Register</a>
        `;
    }

    // ===== INIT =====
    const appBody = document.getElementById("app-body");
    if (isLoggedIn) {
        renderMessenger();
        loadFriends();
        loadPendingRequests();
        pollInterval = setInterval(() => {
            loadPendingRequests();
            loadFriends();
            if (activeFriendId) loadMessages(activeFriendId, false);
        }, 5000);
    } else {
        renderHero();
    }

    // ===== HERO =====
    function renderHero() {
        appBody.innerHTML = `
            <div class="hero">
                <div class="hero-tag">Private Messaging Network</div>
                <h1>Send.<br><span>Connect.</span><br>Message.</h1>
                <p>A simple, direct messenger. Sign in to start conversations with people on the network.</p>
                <div class="hero-actions">
                    <a href="/register.html" class="btn-large primary">Get Started →</a>
                    <a href="/login.html" class="btn-large secondary">Sign In</a>
                </div>
            </div>
        `;
    }

    // ===== MESSENGER LAYOUT =====
    function renderMessenger() {
        appBody.innerHTML = `
            <div class="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">Messages</span>
                    <button class="add-friend-btn" onclick="openModal()" title="Add Friend">+</button>
                </div>
                <div class="friends-list" id="friends-list">
                    <div class="empty-friends">Loading...</div>
                </div>
            </div>
            <div class="chat-panel" id="chat-panel">
                <div class="chat-empty">
                    <div class="big-icon">💬</div>
                    <h3>Select a conversation</h3>
                    <p>Choose a friend from the sidebar,<br>or press <strong style="color:var(--accent)">+</strong> to add someone new.</p>
                </div>
            </div>
        `;
    }

    // ===== FRIENDS =====
    async function loadFriends() {
        try {
            const res = await fetch(`${BASE}/friends/${userId}`);
            const data = await res.json();
            const list = document.getElementById("friends-list");
            if (!list) return;

            if (data.friends.length === 0) {
                list.innerHTML = `<div class="empty-friends">No friends yet.<br>Press <strong style="color:var(--accent)">+</strong> to add someone.</div>`;
                return;
            }

            list.innerHTML = data.friends.map(f => `
                <div class="friend-card ${activeFriendId == f.id ? 'active' : ''}"
                     id="fc-${f.id}" onclick="openChat(${f.id}, '${f.username}')">
                    <div class="friend-avatar">${f.username[0].toUpperCase()}</div>
                    <div class="friend-info">
                        <div class="friend-name">${f.username}</div>
                        <div class="friend-last-msg">${f.last_message ? f.last_message : 'No messages yet'}</div>
                    </div>
                </div>
            `).join('');
        } catch(e) { console.error(e); }
    }

    // ===== OPEN CHAT =====
    function openChat(friendId, friendName) {
        activeFriendId = friendId;
        activeFriendName = friendName;

        document.querySelectorAll('.friend-card').forEach(c => c.classList.remove('active'));
        const card = document.getElementById(`fc-${friendId}`);
        if (card) card.classList.add('active');

        const panel = document.getElementById("chat-panel");
        panel.innerHTML = `
            <div class="chat-header">
                <div class="chat-header-avatar">${friendName[0].toUpperCase()}</div>
                <div class="chat-header-name">${friendName}</div>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <div class="chat-input-bar">
                <input class="chat-input" id="msg-input" placeholder="Message ${friendName}..."
                    onkeydown="if(event.key==='Enter'){event.preventDefault();sendMessage();}" />
                <button class="send-btn" onclick="sendMessage()">Send →</button>
            </div>
        `;

        loadMessages(friendId, true);
    }

    // ===== MESSAGES =====
    async function loadMessages(friendId, scrollToBottom) {
        try {
            const res = await fetch(`${BASE}/messages/${userId}/${friendId}`);
            const data = await res.json();
            const area = document.getElementById("messages-area");
            if (!area) return;

            if (data.messages.length === 0) {
                area.innerHTML = `<div style="color:var(--muted);font-size:0.78rem;text-align:center;margin-top:60px">No messages yet — say hello! 👋</div>`;
                return;
            }

            const prevScroll = area.scrollTop;
            const wasAtBottom = area.scrollHeight - area.clientHeight - prevScroll < 40;

            area.innerHTML = data.messages.map(m => {
                const isSent = m.sender_id == userId;
                const time = new Date(m.sent_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                return `
                    <div class="msg-row ${isSent ? 'sent' : 'received'}">
                        <div class="msg-bubble">
                            ${m.content}
                            <div class="msg-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');

            if (scrollToBottom || wasAtBottom) area.scrollTop = area.scrollHeight;
        } catch(e) { console.error(e); }
    }

    // ===== SEND MESSAGE =====
    async function sendMessage() {
        const input = document.getElementById("msg-input");
        if (!input) return;
        const content = input.value.trim();
        if (!content || !activeFriendId) return;
        input.value = '';

        try {
            await fetch(`${BASE}/send-message`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    sender_id: parseInt(userId),
                    receiver_id: activeFriendId,
                    content
                })
            });
            loadMessages(activeFriendId, true);
            loadFriends();
        } catch(e) { console.error(e); }
    }

    // ===== PENDING REQUESTS =====
    async function loadPendingRequests() {
        try {
            const res = await fetch(`${BASE}/pending-requests/${userId}`);
            const data = await res.json();
            const badge = document.getElementById("notif-badge");
            const list = document.getElementById("notif-list");
            if (!badge) return;

            if (data.requests.length === 0) {
                badge.style.display = 'none';
                if (list) list.innerHTML = `<div class="notif-empty">No pending requests</div>`;
            } else {
                badge.style.display = 'flex';
                badge.textContent = data.requests.length;
                if (list) {
                    list.innerHTML = data.requests.map(r => `
                        <div class="notif-item">
                            <div>
                                <div class="notif-name">${r.username}</div>
                                <div class="notif-sub">wants to be friends</div>
                            </div>
                            <div class="notif-actions">
                                <button class="notif-accept" onclick="respondRequest(${r.request_id}, 'accept')">✓ Accept</button>
                                <button class="notif-decline" onclick="respondRequest(${r.request_id}, 'decline')">✕</button>
                            </div>
                        </div>
                    `).join('');
                }
            }
        } catch(e) {}
    }

    async function respondRequest(requestId, action) {
        try {
            await fetch(`${BASE}/friend-request/respond`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ request_id: requestId, action })
            });
            loadPendingRequests();
            loadFriends();
        } catch(e) {}
    }

    // ===== NOTIF TOGGLE =====
    function toggleNotif(e) {
        e.stopPropagation();
        notifOpen = !notifOpen;
        document.getElementById("notif-dropdown").classList.toggle("open", notifOpen);
    }

    document.addEventListener("click", e => {
        const dropdown = document.getElementById("notif-dropdown");
        const btn = document.getElementById("notif-btn");
        if (notifOpen && dropdown && !dropdown.contains(e.target) && btn && !btn.contains(e.target)) {
            notifOpen = false;
            dropdown.classList.remove("open");
        }
    });

    // ===== ADD FRIEND MODAL =====
    function openModal() {
        document.getElementById("add-modal").classList.add("open");
        setTimeout(() => document.getElementById("search-input").focus(), 50);
    }

    function closeModal() {
        document.getElementById("add-modal").classList.remove("open");
        document.getElementById("search-input").value = '';
        document.getElementById("search-results").innerHTML = '';
        document.getElementById("modal-message").className = 'modal-message';
        document.getElementById("modal-message").textContent = '';
    }

    document.getElementById("add-modal").addEventListener("click", e => {
        if (e.target === document.getElementById("add-modal")) closeModal();
    });

    let searchTimeout;
    async function searchUsers() {
        const query = document.getElementById("search-input").value.trim();
        const results = document.getElementById("search-results");
        if (query.length < 1) { results.innerHTML = ''; return; }
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`${BASE}/users`);
                const data = await res.json();
                const filtered = data.users.filter(u =>
                    u.username.toLowerCase().includes(query.toLowerCase()) && u.id != userId
                );
                if (filtered.length === 0) {
                    results.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);padding:8px 0">No users found</div>`;
                    return;
                }
                results.innerHTML = filtered.map(u => `
                    <div class="search-result-item">
                        <div>
                            <div class="search-result-name">${u.username}</div>
                            <div class="search-result-id">ID: ${u.id}</div>
                        </div>
                        <button class="add-btn" id="add-btn-${u.id}" onclick="sendFriendRequest(${u.id}, '${u.username}')">Add</button>
                    </div>
                `).join('');
            } catch(e) {}
        }, 300);
    }

    async function sendFriendRequest(receiverId, receiverName) {
        const btn = document.getElementById(`add-btn-${receiverId}`);
        if (btn) { btn.disabled = true; btn.textContent = '...'; }
        try {
            const res = await fetch(`${BASE}/friend-request`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ requester_id: parseInt(userId), receiver_id: receiverId })
            });
            const data = await res.json();
            const msg = document.getElementById("modal-message");
            if (res.ok) {
                msg.textContent = `Request sent to ${receiverName}!`;
                msg.className = 'modal-message success';
                if (btn) btn.textContent = 'Sent ✓';
            } else {
                msg.textContent = data.detail || 'Could not send request.';
                msg.className = 'modal-message error';
                if (btn) { btn.disabled = false; btn.textContent = 'Add'; }
            }
        } catch(e) {
            if (btn) { btn.disabled = false; btn.textContent = 'Add'; }
        }
    }

    // ===== LOGOUT =====
    function logout() {
        clearInterval(pollInterval);
        sessionStorage.removeItem("user_id");
        sessionStorage.removeItem("username");
        window.location.reload();
    }
</script>

</body>
</html>
