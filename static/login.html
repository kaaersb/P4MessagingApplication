<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

    <div class="container">
        <a class="logo" href="/">
            <div class="logo-dot"></div>
            Messenger
        </a>

        <h1>Welcome<br>Back</h1>
        <p class="subtitle">Sign in to continue messaging.</p>

        <div class="field">
            <label>Username</label>
            <input type="text" id="username" placeholder="Your username" autocomplete="off" />
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Your password" />
        </div>

        <button class="submit-btn" id="login-btn" onclick="login()">Sign In →</button>

        <div class="message" id="message"></div>

        <div class="footer-link">
            No account yet? <a href="/register.html">Create one</a>
        </div>
    </div>

    <div class="corner-decoration">v0.1 — dev build</div>

    <script src="/static/js/login.js"></script>
</body>
</html>
