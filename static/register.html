<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

    <div class="container">
        <a class="logo" href="/">
            <div class="logo-dot"></div>
            Messenger
        </a>

        <h1>Create<br>Account</h1>
        <p class="subtitle">Join the network. Start messaging.</p>

        <div class="field">
            <label>Username</label>
            <input type="text" id="username" placeholder="e.g. kaare_dev" autocomplete="off" />
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="off" />
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Choose a password" />
        </div>

        <button class="submit-btn" id="register-btn" onclick="register()">Create Account →</button>

        <div class="message" id="message"></div>

        <div class="footer-link">
            Already have an account? <a href="/login.html">Sign in</a>
        </div>
    </div>

    <div class="corner-decoration">v0.1 — dev build</div>

    <script src="/static/js/register.js"></script>
</body>
</html>
